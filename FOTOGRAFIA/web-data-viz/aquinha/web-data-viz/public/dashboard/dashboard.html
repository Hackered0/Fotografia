<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LYRIS | Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>


    <style>

        body {

            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            background: #f5f5f5;

        }



        .menu {

            width: 220px;
            height: 100vh;
            background: #111;
            color: white;
            padding: 20px;

        }


        .menu h1 {

            font-size: 35px;

        }


        .menu p {

            margin-top: 30px;

        }

        .conteudo {

            width: 100%;
            padding: 30px;

        }



        .kpis {

            display: flex;

        }



        .card {

            border: 1px solid black;
            padding: 20px;
            width: 20%;
            margin-right: 20px;
            background: white;

        }



        .card h3 {

            margin: 0;

        }



        .card p {

            font-size: 30px;

        }




        .graficos {

            display: flex;
            margin-top: 40px;

        }



        .box {

            width: 45%;
            border: 1px solid black;
            padding: 20px;
            margin-right: 20px;
            background: white;

        }



        canvas {

            width: 100%;

        }


    </style>


</head>



<body>


    <!-- MENU -->

    <div class="menu">


        <h1>LYRIS</h1>

        <p>Dashboard</p>

        <p>
            <a href="quiz.html">Quiz</a>
        </p>
      <p><a href="../index.html">sair</a></p>

    </div>

    <div class="conteudo">


        <h1>Dashboard</h1>


        <div class="kpis">

            <div class="card">

                <h3>Total de quizzes</h3>

                <p id="total">0</p>

            </div>

            <div class="card">

                <h3>Média de acertos</h3>

                <p id="media">0</p>

            </div>

            <div class="card">

                <h3>Usuários</h3>

                <p id="usuarios">0</p>

            </div>


            <div class="card">

                <h3>Maior nota</h3>

                <p id="favorito">0</p>

            </div>



        </div>


        <div class="graficos">



            <div class="box">


                <h2>Quantidade de acertos</h2>


                <canvas id="graficoBarra"></canvas>



            </div>





            <div class="box">


                <h2>Evolução dos quizzes</h2>


                <canvas id="graficoLinha"></canvas>



            </div>




        </div>




    </div>









<script>


fetch("/dashboard/kpis")


.then(function(resposta){


    return resposta.json();


})


.then(function(dados){



    document.getElementById("total").innerHTML = dados.total;


    document.getElementById("media").innerHTML = dados.media;


    document.getElementById("usuarios").innerHTML = dados.usuarios;


    document.getElementById("favorito").innerHTML = dados.favorito;



});


fetch("/dashboard/estilos")


.then(function(resposta){


    return resposta.json();


})


.then(function(dados){



    new Chart(

        document.getElementById("graficoBarra"),


        {


            type:"bar",



            data:{


                labels:dados.estilos,


                datasets:[{


                    label:"Quantidade de pessoas",


                    data:dados.quantidades



                }]


            }


        }


    );



});


fetch("/dashboard/evolucao")


.then(function(resposta){


    return resposta.json();


})


.then(function(dados){



    new Chart(


        document.getElementById("graficoLinha"),



        {


            type:"line",



            data:{


                labels:dados.datas,



                datasets:[{


                    label:"Média de acertos",


                    data:dados.valores



                }]



            }



        }



    );



});



</script>



</body>


</html>
